name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # release.yml is generated by `dist generate`. `dist host` re-checks it at
  # release time and fails the whole release if it drifted, so catch drift here
  # instead: on a PR, not after the tag is already pushed.
  dist-generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dist
        # bash for pipefail: otherwise `sh` swallows a non-0 from `curl`.
        # version comes from Cargo.toml so it cannot drift from what release.yml pins
        shell: bash
        run: |
          version="$(grep -m1 '^cargo-dist-version' Cargo.toml | cut -d'"' -f2)"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - name: Check generated workflows are up to date
        run: dist generate --check

  prek:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: prek
      - name: Run prek hooks
        uses: j178/prek-action@v3.0.0
        with:
          prek-version: "0.4.13"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check errors
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --verbose
